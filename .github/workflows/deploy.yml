name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs to read the repo, write a Pages deployment, and mint the
# OIDC token deploy-pages exchanges for its upload credentials.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: this site is the privacy and support
# destination declared for a live Store listing, so a half-finished rollout is
# worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22
      - name: Check built SEO and public URL contracts
        run: npm run check:seo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
